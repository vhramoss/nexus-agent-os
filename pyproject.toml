[project]
name = "nexus-agent-os"
version = "0.1.0"
description = ""
authors = [
    { name = "Victor Hugo Ramos", email = "victorhramos.ti@outlook.com" }
]
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "pydantic (>=2.11.9,<2.13)",
    "pydantic_settings (>=2.10.0,<2.11.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "langgraph (>=1.1.10,<2.0.0)",
    "langchain (>=1.2.17,<2.0.0)",
    "crewai (>=1.14.4,<2.0.0)",
    "sentence-transformers (>=5.4.1,<6.0.0)",
    "faiss-cpu (>=1.13.2,<2.0.0)",
    "redis (>=7.4.0,<8.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ✅ DEV DEPENDENCIES — UNIFICADAS
[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
httpx = "^0.27"
fakeredis = "^2.21"
ruff = "^0.6"
mypy = "^1.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: testes unitários rápidos",
    "integration: testes de integração",
    "slow: testes que demoram > 1s",
]

# ✅ RUFF CONFIG
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__", ".git"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ✅ MYPY CONFIG
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false
